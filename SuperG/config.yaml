dimension: 768
data:
  protocol: item_cold
  seed: 1
  exclude_query_item: true
  include_explicit_negative_behaviors: false
features:
  device: cpu
  local_files_only: true
  text_model: FacebookAI/roberta-base
  vision_model: Salesforce/blip-image-captioning-base
  revisions: {text: null, vision: null}
  batch_size: 16
  max_text_length: 512
  beats_source: null
  beats_checkpoint: null
  max_audio_seconds: null
encoder:
  layers: 1
  heads: 2
  hidden: 3072
  max_history: 100
  dropout: 0.1
contrastive:
  temperature: 0.1
  denominator: negative_only
  ratio: 0.2
  segments: 3
retrieval:
  hidden: 768
  weighting: 0.6
  similar_users: 5
  per_user: 5
  top_behaviors: 5
  training_proposal: semantic
  inference_proposal: personalized
  bank_batch_size: 256
llm:
  model: meta-llama/Meta-Llama-3-8B-Instruct
  revision: null
  local_files_only: true
  device: auto
  dtype: auto
  adapter_hidden: 256
  max_length: 2048
  metadata_characters: 256
  instruction_position: last
  feedback_distribution: full_vocab
  prediction_distribution: yes_no
  feedback_batch_size: 1
  gradient_checkpointing: true
training:
  seed: 1
  epochs: 100
  batch_size: 1024
  learning_rate: 0.001
  weight_decay: 0
  negative_ratio: 1
  alpha: 0.5
  beta: 0.3
  gradient_clip: 1
  patience: 5
  early_stopping_metric: Recall@20
  bank_refresh_steps: 1
  detach_feedback: false
evaluation:
  ks: [10, 20]
  sampled_negatives: null
ablations:
  no_ibmm_score: semantic
  no_bhrm_adaptation: zero_pad
sweeps:
  training.alpha: [0.1, 0.3, 0.5, 0.7, 1.0]
  training.beta: [0.1, 0.3, 0.5, 0.7, 1.0]
  retrieval.weighting: [0.2, 0.4, 0.5, 0.6, 0.8, 1.0]
  retrieval.similar_users: [1, 3, 5, 7, 10]
  retrieval.top_behaviors: [5, 10, 15, 20, 25]
